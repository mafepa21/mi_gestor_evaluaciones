name: Apple Builds

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  apple-builds:
    name: iOS and macOS build verification
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Verify Apple builds
        run: scripts/verify_apple_builds.sh

      - name: Run planner tests
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project kmp/iosApp/MiGestorKMPiOS.xcodeproj \
            -scheme MiGestorPlannerTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath /tmp/MiGestorPlannerTestsDerivedData \
            test 2>&1 | tee /tmp/planner_tests.log

      - name: Upload Apple build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-build-logs
          path: |
            /tmp/mac_build_*.log
            /tmp/ios_build_*.log
            /tmp/planner_tests.log
