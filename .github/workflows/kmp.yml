name: KMP

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  kmp-tests:
    name: Shared and data tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test shared module
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :shared:test

      - name: Test data module
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :data:desktopTest
